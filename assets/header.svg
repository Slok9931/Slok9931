<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Terminal: Slok Tulsyan, Full-Stack Web Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffff"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff4081"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="c1"><rect x="40" y="76" height="26" width="0"><animate attributeName="width" from="0" to="120" dur="0.5s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="102" height="26" width="0"><animate attributeName="width" from="0" to="520" dur="1.2s" begin="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="138" height="26" width="0"><animate attributeName="width" from="0" to="220" dur="0.6s" begin="2.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="164" height="26" width="0"><animate attributeName="width" from="0" to="640" dur="1.4s" begin="3.4s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#grid)"/>

  <!-- title bar -->
  <path d="M2 16a14 14 0 0 1 14-14h868a14 14 0 0 1 14 14v22H2z" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="22" r="6" fill="#27c93f"/>
  <text x="450" y="27" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Menlo,Consolas,'Courier New',monospace" font-size="13" fill="#8b949e">slok@dev: ~/profile</text>

  <g font-family="'Fira Code','JetBrains Mono',Menlo,Consolas,'Courier New',monospace" font-size="16">
    <g clip-path="url(#c1)">
      <text x="40" y="96"><tspan fill="#27c93f">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
    </g>
    <g clip-path="url(#c2)">
      <text x="40" y="122" fill="#00ffff" font-weight="bold">&gt; Slok Tulsyan  //  Full-Stack Web Developer</text>
    </g>
    <g clip-path="url(#c3)">
      <text x="40" y="158"><tspan fill="#27c93f">$</tspan><tspan fill="#e6edf3"> cat stack.txt</tspan></text>
    </g>
    <g clip-path="url(#c4)">
      <text x="40" y="184" fill="#ff79c6">&gt; React · Next.js · Node.js · FastAPI · MongoDB</text>
    </g>
    <text x="40" y="220" fill="#27c93f" opacity="0">$<animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="5s" fill="freeze"/></text>
    <rect x="58" y="205" width="10" height="19" fill="#00ffff" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1s" begin="5s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
